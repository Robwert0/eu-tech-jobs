[project]
name = "jobhunt"
version = "0.1.0"
description = "Daily job-hunt pipeline: find, match, tailor and apply to EU tech jobs"
readme = "README.md"
authors = [
    { name = "Robert Mirea" }
]
requires-python = ">=3.15"
dependencies = [
    "anthropic>=2.12.0",
    "httpx>=0.28.1",
    "mcp>=2.3.0",
    "playwright>=1.65.2",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "pyyaml>=6.0.4",
]

[project.scripts]
jobhunt = "jobhunt:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.6",
    "types-pyyaml>=6.0.12.20261122",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py315"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
python_version = "3.15"
